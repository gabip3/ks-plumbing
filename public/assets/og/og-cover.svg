<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Archivo, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1730"/>
      <stop offset="0.55" stop-color="#050b16"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#1b4fd8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1b4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2129"/>
      <stop offset="0.35" stop-color="#8b939e"/>
      <stop offset="0.6" stop-color="#3b424b"/>
      <stop offset="1" stop-color="#262b33"/>
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- pipe rail -->
  <rect x="0" y="470" width="1200" height="8" fill="url(#metal)"/>
  <rect x="238" y="459" width="16" height="30" fill="url(#metal)"/>
  <rect x="946" y="459" width="16" height="30" fill="url(#metal)"/>
  <path d="M700 486c0 8 9 14 9 21a9 9 0 0 1-18 0c0-7 9-13 9-21z" fill="#38a9f0"/>

  <!-- eyebrow -->
  <g font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="4.6">
    <rect x="80" y="86" width="34" height="1.5" fill="#38a9f0"/>
    <text x="128" y="93" fill="#38a9f0">LICENSED &amp; INSURED · BOISE, IDAHO</text>
  </g>

  <!-- headline -->
  <g fill="#ffffff" font-size="112" font-weight="600" letter-spacing="-5">
    <text x="78" y="248">We show up.</text>
    <text x="94" y="352">We solve it.</text>
  </g>
  <text x="112" y="456" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="112" fill="#38a9f0" letter-spacing="-3">You relax.</text>

  <!-- footer bar -->
  <g font-family="IBM Plex Mono, monospace" font-size="19" letter-spacing="2.4">
    <text x="80" y="560" fill="#ffffff">KS PLUMBING</text>
    <text x="80" y="592" fill="#ffffff" fill-opacity="0.45">(986) 280-9087</text>
    <text x="1120" y="560" fill="#ffffff" fill-opacity="0.45" text-anchor="end">24/7 EMERGENCY</text>
    <text x="1120" y="592" fill="#ffffff" fill-opacity="0.45" text-anchor="end">FREE ESTIMATES</text>
  </g>
</svg>
